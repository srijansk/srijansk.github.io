<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reviewing what an agent wrote: prototype</title>
<link rel="stylesheet" href="../../writing/_figure.css" />
<style>
  :root {
    --human: rgba(250, 204, 21, 0.32);
    --human-ring: rgba(250, 204, 21, 0.5);
    --human-ink: #6B5000;
  }
  body { padding: 18px 20px 20px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .head { padding-bottom: 10px; }
  .title { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

  /* Counts that open what they count: each steps through its sentences. */
  .doors {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 0 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .door {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 4px 9px;
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--soft);
    font-size: 12.5px;
  }
  .door b { font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }
  .door:hover { border-color: var(--accent-mid); }
  .door.is-zero { color: var(--muted); }
  .door.is-zero b { color: var(--muted); }
  .door-warn b { color: var(--warn); }
  .door-ok b { color: var(--accent); }

  .changes {
    margin: 12px 0 0;
    padding: 7px 11px;
    border-radius: 8px;
    background: var(--accent-soft);
    font-size: 12.5px;
    color: var(--soft);
  }
  .changes b { color: var(--accent); font-weight: 650; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 22px; }
  @media (min-width: 700px) {
    .grid { grid-template-columns: minmax(0, 1fr) minmax(260px, 38%); }
  }

  .sec { padding: 14px 0; border-bottom: 1px solid var(--hairline); }
  .sec:last-child { border-bottom: 0; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
  .sec h2 { margin: 0; font-size: 14px; font-weight: 650; }
  .sec h2:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .review { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .review button {
    padding: 3px 9px;
    border: 1px solid var(--hairline-strong);
    border-radius: 6px;
    font-size: 12px;
    color: var(--soft);
    background: var(--surface);
  }
  .review button:hover { border-color: var(--accent-mid); }
  .review button[aria-pressed="true"]::before { content: "\2713\00a0"; }
  .review button[data-act="approve"][aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .review button[data-act="changes"][aria-pressed="true"] { background: var(--soft); border-color: var(--soft); color: #FFFFFF; }
  .review button[data-act="reject"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #FFFFFF; }
  .review button[aria-disabled="true"] { opacity: 0.45; cursor: default; }
  .sec.is-rejected .sec-body { opacity: 0.62; }

  .para { margin: 8px 0 0; font-size: 14px; line-height: 1.7; }
  .s {
    border-radius: 3px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .s:focus { outline: none; }
  .s.sel { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
  .s-flag { text-decoration: underline wavy var(--warn); text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
  .s-conflict { text-decoration: underline dotted var(--warn); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
  .s-stale { text-decoration: underline dashed var(--muted); text-decoration-thickness: 1px; text-underline-offset: 4px; }

  /* Citation chips. Outline: cited, not checked. Filled with a tick: checked
   * against the lines it cites. Orange: the check disagrees or sources
   * disagree. Dashed: the cited lines changed after the check. */
  .cite {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 18px;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 3px;
    border: 1px solid var(--accent-mid);
    border-radius: 5px;
    background: var(--surface);
    color: var(--accent);
    font-size: 10.5px;
    font-weight: 650;
    line-height: 1;
    vertical-align: 1px;
    font-variant-numeric: tabular-nums;
  }
  .cite[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cite.st-ok { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .cite.st-flag, .cite.st-conflict { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .cite.st-flag[aria-current="true"], .cite.st-conflict[aria-current="true"] { outline-color: var(--warn); }
  .cite.st-stale { border-style: dashed; border-color: var(--muted); color: var(--soft); }
  .mk { font-size: 9.5px; }

  .human {
    background: var(--human);
    border-radius: 3px;
    padding: 0 1px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .htag {
    display: inline-flex;
    align-items: center;
    height: 18px;
    padding: 0 6px;
    margin-left: 3px;
    border-radius: 5px;
    background: var(--human);
    color: var(--human-ink);
    font-size: 10.5px;
    font-weight: 650;
    line-height: 1;
    vertical-align: 1px;
  }
  .htag[aria-current="true"] { outline: 2px solid var(--human-ink); outline-offset: 1px; }

  .tag {
    display: inline-block;
    margin-left: 5px;
    padding: 0 6px;
    border: 1px solid var(--hairline-strong);
    border-radius: 5px;
    background: var(--bg);
    color: var(--muted);
    font-size: 10.5px;
    line-height: 16px;
    vertical-align: 1px;
  }
  del { color: var(--muted); text-decoration-color: var(--warn); }
  ins { text-decoration: underline; text-decoration-color: var(--accent-mid); text-underline-offset: 3px; background: var(--accent-soft); border-radius: 3px; padding: 0 2px; }

  .note {
    display: flex;
    gap: 8px;
    margin: 8px 0 0;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--warn-soft);
    color: var(--soft);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .note b { color: var(--warn); font-weight: 650; }
  .note.note-stale { background: var(--bg); border: 1px dashed var(--hairline-strong); }
  .note.note-stale b { color: var(--soft); }

  .prop {
    display: block;
    margin: 10px 0 0;
    padding: 8px 10px;
    border: 1px dashed var(--hairline-strong);
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .prop:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .prop-label { display: block; margin-bottom: 2px; font-size: 12px; color: var(--muted); }
  .prop-actions { display: flex; gap: 6px; margin-top: 6px; }
  .prop-actions button { padding: 2px 9px; border: 1px solid var(--hairline-strong); border-radius: 6px; font-size: 12px; background: var(--surface); }
  .prop-actions button:hover { border-color: var(--accent-mid); }
  .prop-done { margin: 8px 0 0; font-size: 12px; color: var(--muted); }

  .cbox { margin: 10px 0 0; }
  .cbox label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
  .cbox textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    background: var(--surface);
    resize: vertical;
  }
  .sec-status { margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .sec-status.st-approved { color: var(--accent); }
  .sec-status.st-warn, .sec-status.st-rejected { color: var(--warn); }

  /* The source a sentence rests on: exact lines, path, position, and state. */
  .pane {
    align-self: start;
    margin-top: 14px;
    padding: 12px 14px 13px;
    border: 1px solid var(--hairline-strong);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(17, 17, 19, 0.04);
    transition: transform 180ms ease;
  }
  .pane.inline { margin: 10px 0 2px; }
  .pane[hidden] { display: none; }
  .pane-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .pane-kicker { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .pane-close { display: none; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .pane.inline .pane-close { display: inline; }
  .pane-head { display: flex; align-items: center; gap: 7px; }
  .pane-head .cite, .pane-head .htag { margin-left: 0; }
  .pane-kind { font-size: 12.5px; font-weight: 650; }
  .pane-path { margin: 5px 0 8px; font-family: var(--mono); font-size: 11.5px; color: var(--soft); overflow-wrap: anywhere; }
  .pane-code {
    margin: 0;
    padding: 7px 0;
    border: 1px solid var(--hairline);
    border-radius: 7px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.55;
  }
  .pane-code .ln { display: flex; padding: 0 10px 0 6px; }
  .pane-code .ln.hl { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .pane-code .ln.changed { background: var(--warn-soft); box-shadow: inset 2px 0 0 var(--warn); }
  .pane-code .ln-n { flex: none; width: 28px; margin-right: 8px; text-align: right; color: var(--muted); user-select: none; }
  .pane-code .ln-t { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pane-quote {
    margin: 0;
    padding: 7px 10px;
    border-left: 2px solid var(--accent-mid);
    border-radius: 0 7px 7px 0;
    background: var(--bg);
    font-size: 13px;
    line-height: 1.55;
    color: var(--soft);
  }
  .pane-ql { display: block; margin-bottom: 2px; font-size: 12px; color: var(--muted); }
  .pane-state { margin: 9px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--soft); }
  .ps-ok { color: var(--accent); }
  .ps-flag, .ps-conflict { color: var(--warn); }
  .ps-human { color: var(--human-ink); }
  .pane-fp { margin: 4px 0 0; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .pane-act { margin-top: 9px; }
  .pane-act button { padding: 4px 10px; border: 1px solid var(--hairline-strong); border-radius: 7px; font-size: 12px; background: var(--surface); color: var(--soft); }
  .pane-act button:hover { border-color: var(--accent-mid); color: var(--text); }

  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid var(--hairline-strong); }
  .bar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { padding: 7px 13px; border: 1px solid var(--hairline-strong); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text); background: var(--surface); }
  .btn:hover { border-color: var(--accent-mid); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .btn-primary:hover { border-color: var(--accent); filter: brightness(1.1); }
  .btn[aria-disabled="true"] { opacity: 0.45; cursor: default; filter: none; }
  .btn-link { padding: 6px 2px; font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .btn-link:hover { color: var(--text); }
  .receipt { margin: 10px 0 0; min-height: 1.5em; font-size: 12.5px; line-height: 1.5; color: var(--soft); }
  .fig-hint { color: var(--muted); }

  @media (max-width: 699px) {
    body { padding: 16px 14px 18px; }
    .cite, .htag { height: 22px; min-width: 24px; }
    .cbox textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="proto" id="proto">
  <header class="head">
    <p class="fig-kicker">Prototype · invented content</p>
    <h1 class="title">Payments ledger</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="doors" id="doors" role="group" aria-label="Sentence states. Each count steps through the sentences it counts."></div>
  <p class="changes" id="changes" hidden></p>

  <div class="grid" id="grid">
    <div class="doc" id="doc"></div>
    <aside class="pane" id="pane" aria-label="Source">
      <div class="pane-body" id="pane-body"></div>
    </aside>
  </div>

  <div class="bar">
    <div class="bar-actions">
      <button type="button" class="btn btn-primary" id="publish" aria-disabled="true">Publish</button>
      <button type="button" class="btn" id="regen" aria-disabled="true">Regenerate</button>
    </div>
    <button type="button" class="btn-link" id="reset">Start over</button>
  </div>
  <p class="receipt" id="receipt" role="status"></p>

  <p class="fig-hint">Everything here is invented, including the agent&rsquo;s rewrites and the checker&rsquo;s results, which are scripted.</p>
</div>

<script>
(function () {
  'use strict';

  // Sources a sentence can rest on. `check` is the starting state:
  // ok (checked against the cited lines), cited (not checked),
  // flag (the check disagrees), conflict (two sources disagree).
  // `change` describes the demo edit to a checked source and what a
  // re-check of the edited lines finds.
  var SRC = {
    s1: { n: 1, kind: 'Code', path: 'ledger/settle.py', pos: 'lines 142–151', start: 142,
          code: ['def post_refund(entry, event):',
                 '    """Post a refund only once the processor has settled it."""',
                 '    if not event.settled:',
                 '        return defer(entry, until="settlement")',
                 '    if event.is_retry:',
                 '        return skip(entry, reason="retry")',
                 '    entry.settled_at = event.settled_at',
                 '    ledger.post(entry)',
                 '    audit.record(entry, event_id=event.id)',
                 '    return entry'],
          hl: [2, 3, 7], check: 'ok', fp: '7c2e19', on: '21 Oct',
          change: { line: 7, to: '    ledger.post(entry, batch=event.batch_id)', recheck: 'ok', fp: 'b04d6a',
                    note: 'Re-checked against the changed lines: refunds still post only after settlement.' } },
    s2: { n: 2, kind: 'Document', path: 'docs/ledger.md', pos: 'section 3, paragraph 2',
          quote: 'A chargeback never writes a negative amount. It reverses the original entry and links the reversal to it, so the payment’s history reads in order.',
          check: 'cited' },
    s3: { n: 3, kind: 'Code', path: 'ledger/config.py', pos: 'line 37', start: 37,
          code: ['SETTLEMENT_WINDOW_DAYS = 3  # business days after capture'], hl: [0],
          check: 'flag', flag: 'The sentence says two days; line 37 says three.' },
    s3r: { n: 3, kind: 'Code', path: 'ledger/config.py', pos: 'line 37', start: 37,
          code: ['SETTLEMENT_WINDOW_DAYS = 3  # business days after capture'], hl: [0],
          check: 'ok', fp: '91aa03', on: 'today',
          change: { line: 0, to: 'SETTLEMENT_WINDOW_DAYS = 2  # business days after capture', recheck: 'flag', fp: '5e7f20',
                    flag: 'The sentence says three days; line 37 now says two.' } },
    s4: { n: 4, kind: 'Query', path: 'jobs/rollup.sql', pos: 'lines 18–24', start: 18,
          code: ['SELECT merchant_id,', '       DATE(settled_at) AS day,', '       SUM(amount)      AS total', 'FROM ledger_entries',
                 'WHERE is_retry = FALSE', "  AND status = 'posted'", 'GROUP BY merchant_id, day;'],
          hl: [4], check: 'ok', fp: '2d81f4', on: '21 Oct',
          change: { line: 5, to: "  AND status IN ('posted', 'reversed')", recheck: 'ok', fp: 'c6390b',
                    note: 'Re-checked against the changed lines: retried events are still excluded.' } },
    s5: { n: 5, kind: 'Document', path: 'CHANGELOG.md', pos: 'release 2.8.0',
          quote: '11 March: new fee schedule for card-present payments.',
          check: 'conflict', conflict: 'Disagrees with source 6 about the date. The page shows both.' },
    s6: { n: 6, kind: 'Change history', path: 'config/fees.yaml', pos: 'commit 4e1a9c0',
          code: ['4e1a9c0  14 Mar  fees: move card_present to schedule B'], hl: [0],
          check: 'conflict', conflict: 'Disagrees with source 5 about the date. The page shows both.' },
    s7: { n: 7, kind: 'Code', path: 'workers/retry.py', pos: 'line 12', start: 12,
          code: ['    # give up after five attempts'], hl: [0],
          check: 'cited', why: 'It is a comment, not code, so the sentence says it is unsure.' },
    s7r: { n: 7, kind: 'Code', path: 'workers/retry.py', pos: 'line 4', start: 4,
          code: ['MAX_ATTEMPTS = 5'], hl: [0], check: 'ok', fp: '0f4c88', on: 'today',
          change: { line: 0, to: 'MAX_ATTEMPTS = int(os.environ.get("MAX_ATTEMPTS", 5))', recheck: 'ok', fp: 'e21b57',
                    note: 'Re-checked against the changed line: the default is still five.' } },
    s8: { n: 8, kind: 'Code', path: 'ledger/events.py', pos: 'lines 55–58', start: 55,
          code: ['def retry(event):', '    return replace(event,', '                   attempt=event.attempt + 1,',
                 '                   idempotency_key=event.idempotency_key)'], hl: [3],
          check: 'cited' },
    h1: { human: true, kind: 'Written by a person', path: 'Dana, payments team', pos: 'edited 9 Oct',
          quoteLabel: 'The agent’s sentence she replaced:', quote: 'Daily totals are final at midnight UTC.' }
  };

  var SECTIONS = [
    { title: 'When a refund posts', request: 'Check the settlement window against the config.',
      draft: [
        { id: 'a1', t: 'A refund posts to the ledger only after the payment processor confirms settlement.', src: ['s1'] },
        { id: 'a2', t: 'Chargebacks reverse the original entry instead of adding a negative one, so the payment’s history stays in order.', src: ['s2'] },
        { id: 'a3', t: 'Settlement closes two business days after capture.', src: ['s3'] }
      ],
      regen: [
        { id: 'a1', t: 'A refund posts to the ledger only after the payment processor confirms settlement.', src: ['s1'] },
        { id: 'a2', t: 'Chargebacks reverse the original entry instead of adding a negative one, so the payment’s history stays in order.', src: ['s2'] },
        { id: 'a3', pre: 'Settlement closes ', del: 'two', ins: 'three', post: ' business days after capture.', src: ['s3r'], tag: 'rewritten' }
      ],
      rewrites: 1,
      regenMsg: 'Rewritten from your request: one sentence changed and was checked again. Review the section again.' },
    { title: 'Daily totals', request: 'Which fee date is right?',
      draft: [
        { id: 'b1', t: 'Daily totals exclude retried events, so a payment retried three times counts once.', src: ['s4'] },
        { id: 'b2', t: 'A day’s totals are final at 06:00 UTC, once the nightly rollup finishes; anything read earlier can still change.', human: 'h1' },
        { id: 'b3', t: 'The new fee schedule took effect on 11 March or 14 March.', src: ['s5', 's6'],
          conflictNote: 'The changelog says 11 March; the change history says 14 March. Both stay on the page until someone settles it.' }
      ],
      regen: null,
      rewrites: 0,
      regenMsg: 'Nothing rewritten. Neither source outranks the other, so both dates stay, and Dana’s sentence is unchanged.' },
    { title: 'Retries', request: 'Find where the retry limit is set.',
      draft: [
        { id: 'c1', t: 'Retries appear to stop after five attempts, though the only source is a code comment.', src: ['s7'] },
        { id: 'c2', t: 'A retried event keeps the original event’s idempotency key, which is how the rollup recognises it.', src: ['s8'], proposed: true }
      ],
      regen: [
        { id: 'c1', pre: 'Retries ', del: 'appear to stop after five attempts, though the only source is a code comment.', ins: 'stop after five attempts.', post: '', src: ['s7r'], tag: 'rewritten' },
        { id: 'c2', t: 'A retried event keeps the original event’s idempotency key, which is how the rollup recognises it.', src: ['s8'], proposed: true }
      ],
      rewrites: 1,
      regenMsg: 'Rewritten from your request: the agent found the setting, so the sentence no longer hedges. The proposal still waits for you.' }
  ];

  var DOORS = [
    { key: 'ok', one: 'checked', many: 'checked', cls: 'door-ok' },
    { key: 'cited', one: 'cited, not checked', many: 'cited, not checked', cls: '' },
    { key: 'issue', one: 'open issue', many: 'open issues', cls: 'door-warn' },
    { key: 'stale', one: 'needs a re-check', many: 'need a re-check', cls: '' },
    { key: 'human', one: 'written by a person', many: 'written by people', cls: '' },
    { key: 'proposal', one: 'proposal waiting', many: 'proposals waiting', cls: '' }
  ];
  var INTRO = 'Review each section: approve it, request changes, or reject it. Then publish your decisions, or regenerate the sections you asked to change.';

  var root = document.getElementById('proto');
  var docEl = document.getElementById('doc');
  var grid = document.getElementById('grid');
  var pane = document.getElementById('pane');
  var paneBody = document.getElementById('pane-body');
  var subEl = document.getElementById('sub');
  var doorsEl = document.getElementById('doors');
  var changesEl = document.getElementById('changes');
  var receipt = document.getElementById('receipt');
  var pubBtn = document.getElementById('publish');
  var regenBtn = document.getElementById('regen');
  var narrow = window.matchMedia('(max-width: 699px)');

  var state, live, version, selKey, selSentence, doorPos, paneClosed;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function each(list, fn) { Array.prototype.forEach.call(list, fn); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function say(text) { receipt.textContent = text; }

  function fresh() {
    version = 4;
    selKey = 's1';
    selSentence = 'a1';
    doorPos = {};
    paneClosed = false;
    live = {};
    Object.keys(SRC).forEach(function (k) {
      var s = SRC[k];
      live[k] = { check: s.check, fp: s.fp, changed: false, flag: s.flag || '', note: '' };
    });
    state = SECTIONS.map(function (sec) {
      return { review: null, request: sec.request, draft: 'draft', regenerated: false, published: false,
               publishedIn: 0, rejected: false, msg: '', prop: null, opened: {}, receiptText: '' };
    });
  }

  // ---- What each sentence's state is, computed in one place. ----
  function sentences(i) {
    var sec = SECTIONS[i];
    return sec[state[i].draft] || sec.draft;
  }
  function sentenceState(s) {
    if (s.human) return 'human';
    var states = (s.src || []).map(function (k) { return live[k].check; });
    if (states.indexOf('conflict') > -1) return 'conflict';
    if (states.indexOf('flag') > -1) return 'flag';
    if (states.indexOf('stale') > -1) return 'stale';
    if (states.length && states.every(function (x) { return x === 'ok'; })) return 'ok';
    return 'cited';
  }
  // Every sentence on the page, in reading order, with its door.
  function inventory() {
    var out = [];
    SECTIONS.forEach(function (sec, i) {
      if (state[i].rejected) return;
      sentences(i).forEach(function (s) {
        if (s.proposed) {
          if (!state[i].prop) out.push({ i: i, s: s, door: 'proposal' });
          if (state[i].prop !== 'approve') return;
        }
        var st = sentenceState(s);
        var door = st === 'flag' || st === 'conflict' ? 'issue' : st;
        out.push({ i: i, s: s, door: door });
      });
    });
    return out;
  }
  function openIssues(i) {
    return sentences(i).filter(function (s) {
      if (s.proposed && state[i].prop !== 'approve') return false;
      var st = sentenceState(s);
      return st === 'flag' || st === 'conflict';
    }).length;
  }
  function sourcesIn(i) {
    var keys = [];
    sentences(i).forEach(function (s) {
      if (s.proposed && state[i].prop !== 'approve') return;
      (s.src || []).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    });
    return keys;
  }

  // ---- Rendering ----
  var secEls = SECTIONS.map(function (sec, i) {
    var el = document.createElement('section');
    el.className = 'sec';
    el.dataset.i = i;
    el.setAttribute('aria-labelledby', 'h-' + i);
    el.innerHTML =
      '<div class="sec-head"><h2 id="h-' + i + '" tabindex="-1">' + esc(sec.title) + '</h2>' +
      '<div class="review" role="group" aria-label="Review the section ' + esc(sec.title) + '">' +
      '<button type="button" data-act="approve" aria-pressed="false">Approve</button>' +
      '<button type="button" data-act="changes" aria-pressed="false">Request changes</button>' +
      '<button type="button" data-act="reject" aria-pressed="false">Reject</button></div></div>' +
      '<div class="sec-body"></div>' +
      '<div class="cbox" hidden><label for="c-' + i + '">What should the agent change?</label>' +
      '<textarea id="c-' + i + '" rows="2"></textarea></div>' +
      '<p class="sec-status"></p>';
    docEl.appendChild(el);
    return el;
  });

  var STATE_WORDS = { ok: 'checked', cited: 'cited, not checked', flag: 'the check disagrees', conflict: 'sources disagree', stale: 'source changed since the check' };
  function chip(key) {
    var s = SRC[key], st = live[key].check;
    var mark = st === 'ok' ? '<span class="mk" aria-hidden="true">&#10003;</span>'
      : st === 'flag' || st === 'conflict' ? '<span class="mk" aria-hidden="true">!</span>'
      : st === 'stale' ? '<span class="mk" aria-hidden="true">&#8635;</span>' : '';
    var label = 'Source ' + s.n + ', ' + STATE_WORDS[st] + ': ' + s.path + ', ' + s.pos;
    return '<button type="button" class="cite st-' + st + '" data-src="' + key + '" aria-label="' + esc(label) + '">' + s.n + mark + '</button>';
  }

  function sentenceHTML(s, i, opts) {
    var st = sentenceState(s);
    var body = s.del
      ? esc(s.pre) + '<del><span class="sr-only">removed: </span>' + esc(s.del) + '</del> <ins><span class="sr-only">added: </span>' + esc(s.ins) + '</ins>' + esc(s.post)
      : esc(s.t || (s.pre + s.ins + s.post));
    if (opts && opts.clean && s.del) body = esc(s.pre + s.ins + s.post);
    if (s.human) body = '<span class="human">' + body + '</span>';
    var tail = (s.src || []).map(chip).join('');
    if (s.human) tail += '<button type="button" class="htag" data-src="' + s.human + '" aria-label="Written by a person: Dana, 9 October">&#9998; Dana</button>';
    if (s.tag && !(opts && opts.clean)) tail += '<span class="tag">' + esc(s.tag) + '</span>';
    if (opts && opts.approved) tail += '<span class="tag">approved proposal</span>';
    var cls = 's' + (st === 'flag' ? ' s-flag' : st === 'conflict' ? ' s-conflict' : st === 'stale' ? ' s-stale' : '');
    return '<span class="' + cls + '" id="snt-' + s.id + '" data-sid="' + s.id + '" tabindex="-1">' + body + tail + '</span>';
  }

  function notesHTML(s) {
    var st = sentenceState(s), html = '';
    if (st === 'flag') {
      var k = (s.src || []).filter(function (x) { return live[x].check === 'flag'; })[0];
      html += '<p class="note"><b aria-hidden="true">!</b><span>' + esc(live[k].flag) + '</span></p>';
    }
    if (st === 'conflict' && s.conflictNote) html += '<p class="note"><b aria-hidden="true">&ne;</b><span>' + esc(s.conflictNote) + '</span></p>';
    if (st === 'stale') {
      var ks = (s.src || []).filter(function (x) { return live[x].check === 'stale'; });
      html += '<p class="note note-stale"><b aria-hidden="true">&#8635;</b><span>' + esc(SRC[ks[0]].path) +
        ' changed after the check, so this sentence lost its check. The other sentences keep theirs.</span></p>';
    }
    return html;
  }

  function renderSection(i) {
    var sec = SECTIONS[i], st = state[i];
    var list = sentences(i);
    var clean = st.published && !st.dirty;
    var main = list.filter(function (s) { return !s.proposed; });
    var prop = list.filter(function (s) { return s.proposed; })[0];
    var html = '<p class="para">' + main.map(function (s) { return sentenceHTML(s, i, { clean: clean }); }).join(' ');
    if (prop && st.prop === 'approve') html += ' ' + sentenceHTML(prop, i, { approved: true });
    html += '</p>';
    main.forEach(function (s) { html += notesHTML(s); });
    if (prop && st.prop === 'approve') html += notesHTML(prop);
    if (prop && !st.prop) {
      html += '<div class="prop" id="snt-' + prop.id + '" tabindex="-1"><span class="prop-label">Proposed by the agent, waiting for a person</span>' +
        '<span class="s" data-sid="' + prop.id + '">' + esc(prop.t) + prop.src.map(chip).join('') + '</span>' +
        '<span class="prop-actions"><button type="button" data-prop="approve" aria-label="Approve the proposed sentence in ' + esc(sec.title) + '">Approve</button>' +
        '<button type="button" data-prop="reject" aria-label="Reject the proposed sentence in ' + esc(sec.title) + '">Reject</button></span></div>';
    }
    if (prop && st.prop === 'reject') html += '<p class="prop-done">Proposal rejected. The agent will not suggest it again unless its source changes.</p>';
    secEls[i].querySelector('.sec-body').innerHTML = html;
    renderReview(i);
  }

  function status(i) {
    var st = state[i], open = openIssues(i);
    if (st.rejected) return ['Rejected. This draft was discarded and the last published version stays; the rejected draft is shown dimmed.', 'st-rejected'];
    if (st.published && !st.dirty) return ['Published in version ' + st.publishedIn + '. ' + st.receiptText + '.', 'st-approved'];
    if (st.review === 'approve') {
      var base = st.receiptText + '. ';
      return open
        ? [base + (open === 1 ? 'One issue is still open' : open + ' issues are still open') + ': publishing signs off on the section as written.', 'st-warn']
        : [base + 'It goes out when you publish.', 'st-approved'];
    }
    if (st.review === 'changes') {
      return st.request.trim()
        ? ['Your request goes to the agent when you regenerate. Approved sections and people’s edits stay as they are.', '']
        : ['Say what should change, then regenerate.', 'st-warn'];
    }
    if (st.review === 'reject') return ['Rejected. Publishing discards this draft and keeps the last published version.', 'st-rejected'];
    if (st.dirty) return ['An approved proposal joins this section with the next publish.', ''];
    if (st.msg) return [st.msg, ''];
    return ['Not reviewed yet.', ''];
  }

  function renderReview(i) {
    var st = state[i], el = secEls[i];
    var locked = st.rejected || (st.published && !st.dirty);
    el.classList.toggle('is-rejected', st.review === 'reject' || st.rejected);
    each(el.querySelectorAll('[data-act]'), function (b) {
      b.setAttribute('aria-pressed', String(st.review === b.dataset.act));
      b.setAttribute('aria-disabled', String(locked));
    });
    var box = el.querySelector('.cbox');
    box.hidden = st.review !== 'changes';
    var ta = box.querySelector('textarea');
    if (ta.value !== st.request) ta.value = st.request;
    var s = status(i);
    var stEl = el.querySelector('.sec-status');
    stEl.textContent = s[0];
    stEl.className = 'sec-status' + (s[1] ? ' ' + s[1] : '');
  }

  function counts() {
    var c = { ok: 0, cited: 0, issue: 0, stale: 0, human: 0, proposal: 0 };
    inventory().forEach(function (x) { c[x.door] += 1; });
    return c;
  }

  function renderDoors() {
    var c = counts();
    doorsEl.innerHTML = DOORS.map(function (d) {
      var n = c[d.key];
      return '<button type="button" class="door ' + d.cls + (n ? '' : ' is-zero') + '" data-door="' + d.key + '" aria-label="' +
        esc(plural(n, d.one, d.many) + (n ? '. Go to the next one.' : '.')) + '"><b>' + n + '</b>' + esc(n === 1 ? d.one : d.many) + '</button>';
    }).join('');
  }

  function updateBar() {
    var approved = 0, rejected = 0, requests = 0, props = 0;
    state.forEach(function (st) {
      if (st.review === 'approve') approved++;
      if (st.review === 'reject') rejected++;
      if (st.review === 'changes' && st.request.trim()) requests++;
      if (st.dirty) props++;
    });
    var parts = [];
    if (approved) parts.push(approved + ' approved');
    if (rejected) parts.push(rejected + ' rejected');
    if (props) parts.push(plural(props, 'proposal', 'proposals'));
    pubBtn.textContent = parts.length ? 'Publish (' + parts.join(', ') + ')' : 'Publish';
    pubBtn.setAttribute('aria-disabled', String(!parts.length));
    regenBtn.textContent = requests ? 'Regenerate (' + plural(requests, 'request', 'requests') + ')' : 'Regenerate';
    regenBtn.setAttribute('aria-disabled', String(!requests));
  }

  function rewrittenSinceStart() {
    var n = 0;
    SECTIONS.forEach(function (sec, i) { if (state[i].draft === 'regen') n += sec.rewrites; });
    return n;
  }

  function renderBanner() {
    if (version === 4) { changesEl.hidden = true; return; }
    var n = rewrittenSinceStart();
    changesEl.innerHTML = '<b>Version ' + version + '</b> · ' + plural(n, 'sentence', 'sentences') +
      ' rewritten since version 4 · approved sections and people’s edits unchanged';
    changesEl.hidden = false;
  }

  function renderAll() {
    SECTIONS.forEach(function (_, i) { renderSection(i); });
    subEl.textContent = 'Version ' + version + ' · written by an agent from 31 sources · 3 of 14 sections shown';
    renderDoors();
    renderBanner();
    updateBar();
    if (!chipFor(selKey)) { selKey = 's1'; selSentence = 'a1'; }
    select(selKey, null, false);
  }

  // ---- The source panel ----
  function renderPane(key) {
    var s = SRC[key], lv = live[key];
    if (s.human) {
      paneBody.innerHTML =
        '<div class="pane-top"><p class="pane-kicker">Who wrote this sentence</p><button type="button" class="pane-close" data-close>Hide</button></div>' +
        '<div class="pane-head"><span class="htag" aria-hidden="true">&#9998;</span><span class="pane-kind">' + esc(s.kind) + '</span></div>' +
        '<p class="pane-path">' + esc(s.path) + ' · ' + esc(s.pos) + '</p>' +
        '<blockquote class="pane-quote"><span class="pane-ql">' + esc(s.quoteLabel) + '</span>' + esc(s.quote) + '</blockquote>' +
        '<p class="pane-state ps-human">A person wrote this sentence. The agent can propose a change to it but cannot make one, so regenerating leaves it as written.</p>';
      return;
    }
    var st = lv.check;
    var mark = st === 'ok' ? '&#10003;' : st === 'flag' || st === 'conflict' ? '!' : st === 'stale' ? '&#8635;' : '';
    var excerpt;
    if (s.code) {
      excerpt = '<pre class="pane-code"><code>' + s.code.map(function (line, j) {
        var changed = lv.changed && s.change && s.change.line === j;
        var text = changed ? s.change.to : line;
        var num = s.start != null ? s.start + j : '';
        var cls = 'ln' + (changed ? ' changed' : s.hl.indexOf(j) > -1 ? ' hl' : '');
        return '<span class="' + cls + '"><span class="ln-n">' + num + '</span><span class="ln-t">' + esc(text) +
          (changed ? '<span class="sr-only"> (changed)</span>' : '') + '</span></span>';
      }).join('') + '</code></pre>';
    } else {
      excerpt = '<blockquote class="pane-quote">' + esc(s.quote) + '</blockquote>';
    }
    var words;
    if (st === 'ok') words = 'Checked against these lines, ' + (lv.changed ? 'just now' : s.on) + '. An automated check can still miss an error; a person’s approval is recorded separately.';
    else if (st === 'cited') words = key === 's8'
      ? (findProp() === 'approve' ? 'Cited, not checked. A person approved the proposed sentence; nobody has checked it against these lines yet.' : 'Read during research. The sentence is only a proposal and waits for a person.')
      : 'Cited, not checked. Nothing on this page is marked checked unless a check ran.' + (s.why ? ' ' + s.why : '');
    else if (st === 'flag') words = 'The check disagrees. ' + lv.flag;
    else if (st === 'conflict') words = s.conflict;
    else words = 'These lines changed after the check, so every sentence citing them lost its check. Sentences citing other sources keep theirs.';
    var actions = '';
    if (s.change && st === 'ok' && !lv.changed) actions = '<div class="pane-act"><button type="button" data-change="' + key + '">Change this file</button></div>';
    if (st === 'stale') actions = '<div class="pane-act"><button type="button" data-recheck="' + key + '">Re-check</button></div>';
    paneBody.innerHTML =
      '<div class="pane-top"><p class="pane-kicker">What this sentence rests on</p><button type="button" class="pane-close" data-close>Hide</button></div>' +
      '<div class="pane-head"><span class="cite st-' + st + '" aria-hidden="true">' + s.n + (mark ? '<span class="mk">' + mark + '</span>' : '') + '</span><span class="pane-kind">' + esc(s.kind) + '</span></div>' +
      '<p class="pane-path">' + esc(s.path) + ' · ' + esc(s.pos) + '</p>' +
      excerpt +
      '<p class="pane-state ps-' + st + '">' + esc(words) + '</p>' +
      (lv.fp && (st === 'ok' || st === 'flag') && s.fp ? '<p class="pane-fp">check bound to these lines · ' + esc(lv.fp) + '</p>' : '') +
      actions;
  }

  function findProp() {
    var i = SECTIONS.length - 1;
    return state[i].prop;
  }

  function chipFor(key) { return docEl.querySelector('.sec-body [data-src="' + key + '"]'); }

  // Select a source. `byUser` records that a reviewer opened it.
  function select(key, chipEl, byUser) {
    var c = chipEl || chipFor(key);
    if (!c) return;
    // Measured before anything moves, so the page can hold the chip still.
    var before = c.getBoundingClientRect().top;
    selKey = key;
    each(docEl.querySelectorAll('.sec-body [aria-current]'), function (n) { n.removeAttribute('aria-current'); });
    each(docEl.querySelectorAll('.s.sel'), function (n) { n.classList.remove('sel'); });
    c.setAttribute('aria-current', 'true');
    var s = c.closest('.s');
    if (s) { s.classList.add('sel'); selSentence = s.dataset.sid; }
    if (byUser) {
      var i = Number(c.closest('.sec').dataset.i);
      if (!SRC[key].human) state[i].opened[key] = true;
      paneClosed = false;
    }
    renderPane(key);
    place(c, byUser ? before : null);
  }

  // Wide: the panel sits level with the sentence it explains. Narrow: it
  // opens under the section and the page holds still while it moves.
  function place(c, before) {
    if (narrow.matches) {
      if (paneClosed) { pane.hidden = true; return; }
      pane.hidden = false;
      var body = c.closest('.sec').querySelector('.sec-body');
      if (body.nextElementSibling !== pane) body.insertAdjacentElement('afterend', pane);
      pane.classList.add('inline');
      pane.style.transform = '';
      if (before != null && window.parent !== window) {
        var delta = c.getBoundingClientRect().top - before;
        // Instant, not smooth: the reader should not see the page travel.
        if (Math.abs(delta) > 1) {
          try { window.parent.scrollBy({ top: delta, left: 0, behavior: 'instant' }); } catch (e) { /* not same-origin */ }
        }
      }
      return;
    }
    pane.hidden = false;
    if (pane.parentNode !== grid) grid.appendChild(pane);
    pane.classList.remove('inline');
    var anchor = c.closest('.s') || c;
    var y = anchor.getBoundingClientRect().top - grid.getBoundingClientRect().top - 14;
    var max = docEl.getBoundingClientRect().height - pane.offsetHeight - 14;
    pane.style.transform = 'translateY(' + Math.round(Math.max(0, Math.min(y, max))) + 'px)';
  }

  function reAlign() {
    var c = chipFor(selKey);
    if (c) place(c);
  }

  // ---- Actions ----
  function act(i, a) {
    var st = state[i];
    if (st.rejected || (st.published && !st.dirty)) return;
    st.review = st.review === a ? null : a;
    st.msg = '';
    if (st.review === 'approve') {
      var keys = sourcesIn(i);
      var opened = keys.filter(function (k) { return st.opened[k]; }).length;
      st.receiptText = 'Approved by you, ' + opened + ' of ' + plural(keys.length, 'source', 'sources') + ' opened';
    }
    renderReview(i);
    renderDoors();
    updateBar();
    say(st.review ? status(i)[0] : 'Decision cleared for ' + SECTIONS[i].title + '.');
    if (st.review === 'changes') secEls[i].querySelector('textarea').focus();
    reAlign();
  }

  function proposal(i, p) {
    var st = state[i];
    if (st.rejected) return;
    st.prop = p;
    if (st.published) st.dirty = p === 'approve';
    renderSection(i);
    renderDoors();
    updateBar();
    say(p === 'approve'
      ? 'Approved. The sentence joins the section, marked as an approved proposal.'
      : 'Rejected. The section stays as it was.');
    secEls[i].querySelector('h2').focus();
    if (!chipFor(selKey)) selKey = 's1';
    select(selKey, null, false);
  }

  function publish() {
    if (pubBtn.getAttribute('aria-disabled') === 'true') { say('Approve or reject a section first.'); return; }
    var pub = 0, gone = 0, left = 0;
    state.forEach(function (st) {
      if (st.review === 'approve' || st.dirty) {
        pub++;
        st.published = true; st.publishedIn = version; st.review = null; st.dirty = false;
        if (!st.receiptText) st.receiptText = 'Approved by you';
      } else if (st.review === 'reject') {
        st.rejected = true; st.review = null; gone++;
      }
    });
    state.forEach(function (st) { if (!st.published && !st.rejected) left++; });
    var msg = 'Published ' + plural(pub, 'section', 'sections') + ' in version ' + version + '.';
    if (gone) msg += ' Discarded ' + plural(gone, 'rejected draft', 'rejected drafts') + '.';
    msg += left ? ' ' + plural(left, 'section stays', 'sections stay') + ' as last published.' : ' Every section is decided. Start over to try another path.';
    renderAll();
    say(msg);
  }

  function regenerate() {
    if (regenBtn.getAttribute('aria-disabled') === 'true') { say('Request changes on a section and say what should change, then regenerate.'); return; }
    var count = 0;
    version += 1;
    state.forEach(function (st, i) {
      if (st.review !== 'changes' || !st.request.trim()) return;
      var sec = SECTIONS[i];
      if (!st.regenerated) {
        st.regenerated = true;
        if (sec.regen) st.draft = 'regen';
        st.msg = sec.regenMsg;
      } else {
        st.msg = 'Regenerated again: the agent found nothing more to change from this request.';
      }
      st.review = null;
      st.request = '';
      st.opened = {};
      count++;
    });
    renderAll();
    say('Regenerated ' + plural(count, 'section', 'sections') + ' from your requests. Review ' + (count === 1 ? 'it' : 'them') + ' again before publishing.');
  }

  function changeSource(key) {
    var s = SRC[key], lv = live[key];
    lv.changed = true;
    lv.check = 'stale';
    var hit = 0;
    inventory().forEach(function (x) { if ((x.s.src || []).indexOf(key) > -1) hit++; });
    renderAll();
    select(key, null, false);
    say(s.path + ' changed. ' + plural(hit, 'sentence', 'sentences') + ' citing it lost the check; every other sentence keeps its state.');
  }

  function recheck(key) {
    var s = SRC[key], lv = live[key];
    lv.check = s.change.recheck;
    lv.fp = s.change.fp;
    if (lv.check === 'flag') lv.flag = s.change.flag;
    renderAll();
    select(key, null, false);
    say(lv.check === 'ok' ? s.change.note : 'Re-checked: the check now disagrees. ' + s.change.flag);
  }

  function stepDoor(key) {
    var items = inventory().filter(function (x) { return x.door === key; });
    var d = DOORS.filter(function (x) { return x.key === key; })[0];
    if (!items.length) { say('Nothing here: 0 ' + d.many + '.'); return; }
    var pos = ((doorPos[key] === undefined ? -1 : doorPos[key]) + 1) % items.length;
    doorPos[key] = pos;
    var x = items[pos];
    var target = document.getElementById('snt-' + x.s.id);
    var label = x.s.t || (x.s.pre + x.s.ins + x.s.post);
    say((pos + 1) + ' of ' + items.length + ' ' + (items.length === 1 ? d.one : d.many) + ': ' + label);
    if (!target) return;
    var key0 = x.s.human || (x.s.src || [])[0];
    var c = target.querySelector('[data-src="' + key0 + '"]') || chipFor(key0);
    if (c) select(key0, c, true);
    target.focus({ preventScroll: true });
    target.scrollIntoView({ block: 'nearest' });
  }

  function reset() {
    fresh();
    renderAll();
    say(INTRO);
  }

  // ---- Wiring ----
  docEl.addEventListener('click', function (e) {
    var c = e.target.closest('[data-src]');
    if (c) { select(c.dataset.src, c, true); return; }
    var a = e.target.closest('[data-act]');
    if (a) { act(Number(a.closest('.sec').dataset.i), a.dataset.act); return; }
    var p = e.target.closest('[data-prop]');
    if (p) proposal(Number(p.closest('.sec').dataset.i), p.dataset.prop);
  });
  docEl.addEventListener('mouseover', function (e) {
    if (narrow.matches) return;
    var c = e.target.closest('[data-src]');
    if (c && c.dataset.src !== selKey) select(c.dataset.src, c, true);
  });
  docEl.addEventListener('focusin', function (e) {
    var c = e.target.closest('[data-src]');
    if (c && c.dataset.src !== selKey) select(c.dataset.src, c, true);
  });
  docEl.addEventListener('input', function (e) {
    if (e.target.tagName !== 'TEXTAREA') return;
    var i = Number(e.target.closest('.sec').dataset.i);
    state[i].request = e.target.value;
    var s = status(i), stEl = secEls[i].querySelector('.sec-status');
    stEl.textContent = s[0];
    stEl.className = 'sec-status' + (s[1] ? ' ' + s[1] : '');
    updateBar();
  });
  paneBody.addEventListener('click', function (e) {
    var ch = e.target.closest('[data-change]');
    if (ch) { changeSource(ch.dataset.change); return; }
    var rc = e.target.closest('[data-recheck]');
    if (rc) { recheck(rc.dataset.recheck); return; }
    if (e.target.closest('[data-close]')) {
      paneClosed = true;
      var c = chipFor(selKey);
      pane.hidden = true;
      if (c) c.focus();
    }
  });
  doorsEl.addEventListener('click', function (e) {
    var d = e.target.closest('[data-door]');
    if (d) stepDoor(d.dataset.door);
  });
  pubBtn.addEventListener('click', publish);
  regenBtn.addEventListener('click', regenerate);
  document.getElementById('reset').addEventListener('click', reset);
  window.addEventListener('resize', reAlign);
  if (narrow.addEventListener) narrow.addEventListener('change', function () { paneClosed = false; reAlign(); });

  fresh();
  renderAll();
  say(INTRO);
})();
</script>
<script src="../../writing/_figure.js"></script>
</body>
