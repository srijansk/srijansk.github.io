<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img"
     aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Three memory tiers and the four moves between the top two</title>
  <desc id="desc">Three stacked bands. Working context at the top: what the model reasons over now, small, expensive, aging. Task memory in the middle: durable, structured, each row with provenance — the findings ledger, evidence records, workspace, already-read set. Long-term memory at the bottom: the reference document and its index, which outlive the task. Four moves between the top two tiers: note at observation with the value, review by reading back before drafting, draft from the tier, and a gate in code that checks every noted value is present before a section closes. A right-hand column lists which published systems keep which tier.</desc>
  <style>
    .kicker { font-size: 11.75px; fill: #595959; letter-spacing: .11em; text-transform: uppercase; }
    .h { font-size: 15.25px; fill: #1A1A1A; font-weight: 600; }  .sub { font-size: 12.9px; fill: #595959; }
    .rule { font-size: 12.9px; fill: #2F2F2F; font-style: italic; }  .chip { font-size: 11.75px; fill: #2F2F2F; }
    .arrow { font-size: 12.9px; font-weight: 600; }  .arrowsub { font-size: 11.75px; fill: #595959; }
    .fname { font-size: 12.9px; fill: #1A1A1A; font-weight: 600; }  .fwhat { font-size: 11.75px; fill: #595959; }
  </style>
  <rect width="1000" height="590" fill="#FFFFFF"/>
  <g transform="translate(40,0)">
  <rect x="30" y="48" width="660" height="108" rx="3" fill="#FAFAF7" stroke="#D8D8D2" stroke-opacity="1"/>
  <text class="h" x="46" y="72">Working context</text>
  <text class="sub" x="46" y="89">what the model reasons over now · small · expensive · aging</text>
  <text class="rule" x="46" y="144">Rule: what this step needs to decide, plus the constraints that would make it wrong if forgotten.</text>
  <rect x="46" y="100" width="145" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="118" y="114" text-anchor="middle">current section</text>
  <rect x="199.0" y="100" width="112" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="255" y="114" text-anchor="middle">open thread</text>
  <rect x="319.2" y="100" width="112" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="375" y="114" text-anchor="middle">constraints</text>
  <rect x="30" y="256" width="660" height="118" rx="3" fill="rgba(10,92,56,0.05)" stroke="#0A5C38" stroke-opacity="0.5"/>
  <text class="h" x="46" y="280">Task memory</text>
  <text class="sub" x="46" y="297">durable · structured · every row carries where it came from</text>
  <text class="rule" x="46" y="362">Rule: everything else, with provenance — so it can come back as a citation, not a memory.</text>
  <rect x="46" y="308" width="145" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="118" y="322" text-anchor="middle">findings ledger</text>
  <rect x="199.0" y="308" width="153" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="276" y="322" text-anchor="middle">evidence records</text>
  <rect x="360.2" y="308" width="96" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="408" y="322" text-anchor="middle">workspace</text>
  <rect x="464.0" y="308" width="153" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="541" y="322" text-anchor="middle">already-read set</text>
  <rect x="30" y="440" width="660" height="100" rx="3" fill="#FAFAF7" stroke="#D8D8D2" stroke-opacity="1"/>
  <text class="h" x="46" y="464">Long-term memory</text>
  <text class="sub" x="46" y="481">outlives the task</text>
  <text class="rule" x="46" y="528">Rule: what the next reader, human or agent, should not have to rediscover.</text>
  <rect x="46" y="492" width="202" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="147" y="506" text-anchor="middle">the reference document</text>
  <rect x="256.4" y="492" width="96" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8D2"/>
  <text class="chip" x="304" y="506" text-anchor="middle">its index</text>
  <line x1="95" y1="156" x2="95" y2="248" stroke="#0A5C38" stroke-width="1.25"/>
  <path d="M95 256 l -5 -8 l 10 0 z" fill="#0A5C38"/>
  <text class="arrow" x="105" y="204.0" style="fill:#0A5C38">note</text>
  <text class="arrowsub" x="105" y="220.0">at observation, with the value</text>
  <line x1="285" y1="256" x2="285" y2="164" stroke="#0A5C38" stroke-width="1.25"/>
  <path d="M285 156 l -5 8 l 10 0 z" fill="#0A5C38"/>
  <text class="arrow" x="295" y="204.0" style="fill:#0A5C38">review</text>
  <text class="arrowsub" x="295" y="220.0">read back before drafting</text>
  <line x1="445" y1="256" x2="445" y2="164" stroke="#0A5C38" stroke-width="1.25"/>
  <path d="M445 156 l -5 8 l 10 0 z" fill="#0A5C38"/>
  <text class="arrow" x="455" y="204.0" style="fill:#0A5C38">draft</text>
  <text class="arrowsub" x="455" y="220.0">from the tier</text>
  <rect x="562" y="186" width="126" height="28" rx="3" fill="#FFFFFF" stroke="#0A5C38" stroke-width="1.25"/>
  <text class="arrow" x="625" y="204" text-anchor="middle" style="fill:#0A5C38">gate · code, not model</text>
  <text class="arrowsub" x="625" y="232" text-anchor="middle">every noted value present</text>
  <text class="arrowsub" x="625" y="246" text-anchor="middle">before a section closes?</text>
  <line x1="300" y1="374" x2="300" y2="432" stroke="#595959" stroke-width="1.25"/>
  <path d="M300 440 l -5 -8 l 10 0 z" fill="#595959"/>
  <text class="arrow" x="310" y="405.0" style="fill:#595959">commit</text>
  <text class="arrowsub" x="310" y="421.0">small, replay-safe</text>
  <line x1="540" y1="440" x2="540" y2="382" stroke="#595959" stroke-width="1.25" stroke-dasharray="5 4"/>
  <path d="M540 374 l -5 8 l 10 0 z" fill="#595959"/>
  <text class="arrow" x="550" y="405.0" style="fill:#595959">retrieve</text>
  <text class="arrowsub" x="550" y="421.0">ranked; recency is one feature</text>
  <text class="kicker" x="745" y="62">Who keeps which tier</text>
  <text class="fname" x="745" y="88">MemGPT</text>
  <text class="fwhat" x="745" y="103">paging between a small main</text>
  <text class="fwhat" x="745" y="117">context and an external store</text>
  <text class="fname" x="745" y="150">Manus</text>
  <text class="fwhat" x="745" y="165">the file system as the store;</text>
  <text class="fwhat" x="745" y="179">drop the page, keep the URL</text>
  <text class="fname" x="745" y="212">Anthropic</text>
  <text class="fwhat" x="745" y="227">notes outside the window; the</text>
  <text class="fwhat" x="745" y="241">plan saved before it is needed</text>
  <text class="fname" x="745" y="274">Zep / Graphiti</text>
  <text class="fwhat" x="745" y="289">two clocks per fact — recorded</text>
  <text class="fwhat" x="745" y="303">vs true; supersede, don’t</text>
  <text class="fwhat" x="745" y="317">delete</text>
  <text class="fname" x="745" y="350">RaMem</text>
  <text class="fwhat" x="745" y="365">a tier without provenance</text>
  <text class="fwhat" x="745" y="379">collapses into ambiguity</text>
  <text class="fname" x="745" y="412">Generative Agents</text>
  <text class="fwhat" x="745" y="427">recency × importance ×</text>
  <text class="fwhat" x="745" y="441">relevance to bring facts back</text>
  </g>
</svg>
