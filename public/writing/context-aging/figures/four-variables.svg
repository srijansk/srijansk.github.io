<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img"
     aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Four ways a context fails, and the variable each one moves</title>
  <desc id="desc">Four rows. Length: a strip of context cells overflows its frame. Position: cells are bright at the ends and faded in the middle, with the fact in the trough. Contamination: one cell among many is marked wrong. Age: an early cell is bright but the line of its influence fades to nothing before the strip reaches the present.</desc>
