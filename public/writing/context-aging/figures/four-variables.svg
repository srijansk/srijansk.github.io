<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img"
     aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Four lenses on a failing context, and the variable each one names</title>
  <desc id="desc">Four rows, each a strip of context cells inside the same frame. How much: the window is full and every cell is used less reliably. Where: cells are strong at both ends and faint in the middle, with the fact in the trough. What: one cell among many is marked wrong. When: an early cell is bright, but the line of its influence fades before the strip reaches the present. A note says the first and last rows grow together in every measurement known to the author.</desc>
  <style>
    .kicker { font-size: 11.75px; fill: #62646C; letter-spacing: .11em; text-transform: uppercase; }
    .var    { font-size: 15.25px; fill: #111113; font-weight: 600; }
    .varA   { fill: #2443D6; }
    .cite   { font-size: 11.75px; fill: #62646C; }
    .note   { font-size: 12.9px; fill: #2C2D32; }
    .noteA  { fill: #2443D6; font-weight: 600; }
    .tick   { font-size: 11.75px; fill: #62646C; }
  </style>
