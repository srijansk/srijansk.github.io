    .kicker { font-size: 11.75px; fill: #595959; letter-spacing: .11em; text-transform: uppercase; }
    .var    { font-size: 15.25px; fill: #1A1A1A; font-weight: 600; }
    .varA   { fill: #0A5C38; }
    .cite   { font-size: 11.75px; fill: #595959; }
    .note   { font-size: 12.9px; fill: #2F2F2F; }
    .noteA  { fill: #0A5C38; font-weight: 600; }
    .tick   { font-size: 11.75px; fill: #595959; }
  </style>
