  <text class="tick" x="935" y="146" text-anchor="end">window full</text>
  <text class="var" x="70" y="184">Where</text>
  <text class="cite" x="70" y="201">Lost in the Middle · Liu et al. 2023</text>
  <text class="note" x="70" y="219">the fact sits in the trough</text>
  <rect x="322" y="166" width="613" height="52" rx="4" fill="none" stroke="#111113" stroke-width="1.25" opacity=".45"/>
