<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">Retrieval Is Not Delivery</title>
  <!--
    PLATE GRAMMAR (shared by every plate; keep these in step)
      canvas    1200x630, ground #FAFAF7
      ink box   ~920 x ~340, optically centred on (600, 315)
      strokes   hairline 2 · structure 7 · emphasis 9
      dots      r7 small · r10 mid · r13 large · seal r20 + ring r30
      colours   #1A1A1A ink · #0A5C38 accent · #9B4A2F loss
    Everything sits inside g.ink; scripts/align-plates.py rewrites that
    transform so all four plates share one centre. Do not hand-tune it.

    THIS PLATE: eight strands of evidence enter. Six are lost, one at each
    boundary. Two arrive. The loss is never at the source.
  -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <g class="ink" transform="translate(2,1)">
    <g stroke-linecap="round" fill="none">
      <!-- boundaries between stages -->
      <g stroke="#1A1A1A" stroke-width="2" opacity=".28">
        <line x1="300" y1="130" x2="300" y2="500"/>
        <line x1="480" y1="130" x2="480" y2="500"/>
        <line x1="660" y1="130" x2="660" y2="500"/>
        <line x1="840" y1="130" x2="840" y2="500"/>
      </g>

      <!-- lost at each boundary in turn: 8 → 6 → 4 → 3 → 2 -->
      <g stroke="#1A1A1A" stroke-width="7" opacity=".30">
        <line x1="178" y1="158" x2="300" y2="158"/>
        <line x1="178" y1="473" x2="300" y2="473"/>
        <line x1="178" y1="203" x2="480" y2="203"/>
        <line x1="178" y1="428" x2="480" y2="428"/>
        <line x1="178" y1="248" x2="660" y2="248"/>
        <line x1="178" y1="383" x2="840" y2="383"/>
      </g>

      <!-- the two that survive the whole path -->
      <g stroke="#0A5C38" stroke-width="9">
        <line x1="178" y1="293" x2="1046" y2="293"/>
        <line x1="178" y1="338" x2="1046" y2="338"/>
      </g>
    </g>

    <!-- where a strand was lost -->
    <g stroke="#9B4A2F" stroke-width="4" stroke-linecap="round">
      <g transform="translate(300,158)"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/></g>
      <g transform="translate(300,473)"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/></g>
      <g transform="translate(480,203)"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/></g>
      <g transform="translate(480,428)"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/></g>
      <g transform="translate(660,248)"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/></g>
      <g transform="translate(840,383)"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/></g>
    </g>

    <!-- arrival -->
    <circle cx="1046" cy="293" r="13" fill="#0A5C38"/>
    <circle cx="1046" cy="338" r="13" fill="#0A5C38"/>

    <!-- the source -->
    <path d="M156 158 L142 158 L142 473 L156 473" stroke="#1A1A1A" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
