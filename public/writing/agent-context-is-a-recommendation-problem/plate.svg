<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">Agent Context Is a Recommendation Problem</title>
  <!--
    PLATE GRAMMAR — see retrieval-is-not-delivery/plate.svg for the shared
    frame, strokes, dot radii and colours. g.ink is set by
    scripts/align-plates.py; do not hand-tune it.

    THIS PLATE: everything the organisation knows, narrowed by a first gate,
    then by a second gate that is drawn but absent. The ranking stage is the
    argument, so it is the only thing in the mark that is dashed. Gaps widen
    left to right so the mark reads as a narrowing.
  -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <g class="ink" transform="translate(46,1)">
    <!-- the corpus -->
    <g fill="#1A1A1A" opacity=".34">
      <circle cx="116" cy="164" r="8"/>
