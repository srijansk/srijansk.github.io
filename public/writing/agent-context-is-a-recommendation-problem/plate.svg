    <circle cx="241" cy="401" r="7"/>
    <circle cx="275" cy="401" r="7"/>
    <circle cx="320" cy="402" r="7"/>
    <circle cx="148" cy="453" r="7"/>
    <circle cx="189" cy="451" r="7"/>
    <circle cx="240" cy="444" r="7"/>
    <circle cx="270" cy="446" r="7"/>
    <circle cx="322" cy="452" r="7"/>
  </g>

  <!-- gate one: candidate generation, real -->
  <path d="M452 170 L470 170 L470 460 L452 460" fill="none" stroke="#0A5C38" stroke-width="7" stroke-linecap="round"/>
  <path d="M488 170 L470 170 M488 460 L470 460" fill="none" stroke="#0A5C38" stroke-width="7" stroke-linecap="round"/>

  <!-- survivors -->
  <g fill="#1A1A1A" opacity=".55">
    <circle cx="560" cy="211" r="8"/>
    <circle cx="606" cy="212" r="8"/>
