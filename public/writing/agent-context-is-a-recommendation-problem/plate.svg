    <circle cx="322" cy="221" r="7"/>
    <circle cx="147" cy="272" r="7"/>
    <circle cx="195" cy="275" r="7"/>
    <circle cx="239" cy="264" r="7"/>
    <circle cx="277" cy="272" r="7"/>
    <circle cx="318" cy="265" r="7"/>
    <circle cx="150" cy="309" r="7"/>
    <circle cx="198" cy="320" r="7"/>
    <circle cx="235" cy="312" r="7"/>
    <circle cx="282" cy="316" r="7"/>
    <circle cx="323" cy="320" r="7"/>
