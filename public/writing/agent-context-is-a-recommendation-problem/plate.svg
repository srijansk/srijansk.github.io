    <circle cx="606" cy="358" r="8"/>
    <circle cx="560" cy="431" r="8"/>
    <circle cx="606" cy="432" r="8"/>
  </g>

  <!-- gate two: ranking, missing -->
  <path d="M772 170 L790 170 L790 460 L772 460" fill="none" stroke="#9B4A2F" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10"/>
  <path d="M808 170 L790 170 M808 460 L790 460" fill="none" stroke="#9B4A2F" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10"/>

  <!-- the slate -->
