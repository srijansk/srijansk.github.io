<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">Agent Context Is a Recommendation Problem</title>
  <!--
    Everything the organisation knows, narrowed by a first gate, then by a
    second gate that is drawn but absent. The ranking stage is the argument,
    so it is the only thing in the mark that is dashed.
  -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <!-- the corpus -->
  <g fill="#1A1A1A" opacity=".30">
    <circle cx="146" cy="174" r="7"/>
