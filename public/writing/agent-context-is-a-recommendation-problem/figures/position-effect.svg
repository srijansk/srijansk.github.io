<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"
     aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Effective use of an item by its position in a long context</title>
  <desc id="desc">A curve showing that an item placed near the start or the end of a long context is used far more effectively than the identical item placed in the middle. A schematic, not data: the U-shape follows Liu et al. (2023). Position bias in ranked lists is a related effect that decays from the top rather than recovering.</desc>

  <style>
    .kicker { font-size: 11.75px; fill: #62646C; letter-spacing: .11em; text-transform: uppercase; }
    .ax     { font-size: 12.9px; fill: #62646C; }
    .axb    { font-size: 12.9px; fill: #2C2D32; font-weight: 600; }
    .ann    { font-size: 12.9px; fill: #C2410C; }
    .annok  { font-size: 12.9px; fill: #2443D6; }
    .note   { font-size: 12.9px; fill: #62646C; }
    .lede   { font-size: 14.1px; fill: #2C2D32; }
  </style>

  <rect width="1000" height="420" fill="#FFFFFF"/>

  <g transform="translate(40,0)">
  <text class="kicker" x="30" y="26">Position is a treatment, not an accident</text>

  <!-- plot frame -->
  <line x1="90" y1="60" x2="90" y2="290" stroke="#DCDCE0"/>
  <line x1="90" y1="290" x2="880" y2="290" stroke="#DCDCE0"/>

  <!-- gridlines -->
  <line x1="90" y1="75"  x2="880" y2="75"  stroke="#EFEFF1"/>
  <line x1="90" y1="130" x2="880" y2="130" stroke="#EFEFF1"/>
  <line x1="90" y1="185" x2="880" y2="185" stroke="#EFEFF1"/>
  <line x1="90" y1="240" x2="880" y2="240" stroke="#EFEFF1"/>

  <!-- y axis -->
  <text class="ax" x="80" y="79"  text-anchor="end">high</text>
  <text class="ax" x="80" y="244" text-anchor="end">low</text>
  <text class="axb" x="34" y="180" transform="rotate(-90 34 180)" text-anchor="middle">effective use</text>

  <!-- the dip region -->
  <rect x="270" y="60" width="380" height="230" fill="rgba(194,65,12,0.055)"/>
  <line x1="270" y1="60" x2="270" y2="290" stroke="rgba(194,65,12,.4)" stroke-dasharray="3 3"/>
  <line x1="650" y1="60" x2="650" y2="290" stroke="rgba(194,65,12,.4)" stroke-dasharray="3 3"/>

  <!-- curve: high, dip, recover -->
  <path d="M90 82
           C 150 84, 210 108, 270 158
           C 330 208, 400 232, 460 236
           C 520 232, 590 206, 650 160
           C 710 116, 800 92, 880 86"
        fill="none" stroke="#2443D6" stroke-width="3.0" stroke-linecap="round"/>

  <!-- area under, faint -->
  <path d="M90 82
           C 150 84, 210 108, 270 158
           C 330 208, 400 232, 460 236
           C 520 232, 590 206, 650 160
           C 710 116, 800 92, 880 86
           L 880 290 L 90 290 Z"
        fill="rgba(36,67,214,0.05)"/>

  <!-- markers -->
  <circle cx="90"  cy="82"  r="5" fill="#2443D6"/>
  <circle cx="460" cy="236" r="5" fill="#C2410C"/>
  <circle cx="880" cy="86"  r="5" fill="#2443D6"/>

  <text class="annok" x="102" y="76">start of context</text>
  <text class="annok" x="874" y="76" text-anchor="end">end of context</text>
  <text class="ann"   x="460" y="262" text-anchor="middle">the same item, buried</text>

  <!-- x axis -->
  <text class="ax" x="90"  y="310">first</text>
  <text class="ax" x="460" y="310" text-anchor="middle">middle</text>
  <text class="ax" x="880" y="310" text-anchor="end">last</text>
  <text class="axb" x="485" y="332" text-anchor="middle">position of the item within the assembled context</text>

  <!-- footer mapping -->
  <line x1="30" y1="358" x2="890" y2="358" stroke="#EBEBEE"/>
  <text class="lede" x="30" y="380">Web search measured <tspan font-weight="600">position bias</tspan> in ranked lists in the mid-2000s and corrects for it with</text>
  <text class="lede" x="30" y="398">randomised exposure and propensity weighting. Agent context met a cousin of it as <tspan font-style="italic">lost in the middle</tspan>.</text>
  </g>
</svg>
