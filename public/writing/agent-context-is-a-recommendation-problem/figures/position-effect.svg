<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img"
     aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Effective use of an item by its position in a long context</title>
  <desc id="desc">A curve showing that an item placed near the start or the end of a long context is used far more effectively than the identical item placed in the middle. The same shape describes position bias in ranked lists, where top-of-list items receive disproportionate engagement regardless of quality.</desc>

  <style>
    .kicker { font-size: 10.5px; fill: #595959; letter-spacing: .11em; text-transform: uppercase; }
    .ax     { font-size: 11px; fill: #595959; }
    .axb    { font-size: 11.5px; fill: #2F2F2F; font-weight: 600; }
    .ann    { font-size: 11.5px; fill: #9B4A2F; }
    .annok  { font-size: 11.5px; fill: #0A5C38; }
    .note   { font-size: 11.5px; fill: #595959; }
    .lede   { font-size: 12.5px; fill: #2F2F2F; }
  </style>

  <rect width="920" height="420" fill="#FFFFFF"/>
  <text class="kicker" x="30" y="26">Position is a treatment, not an accident</text>

  <!-- plot frame -->
  <line x1="90" y1="60" x2="90" y2="290" stroke="#D8D8D2"/>
  <line x1="90" y1="290" x2="880" y2="290" stroke="#D8D8D2"/>

  <!-- gridlines -->
  <line x1="90" y1="75"  x2="880" y2="75"  stroke="#F0F0EB"/>
  <line x1="90" y1="130" x2="880" y2="130" stroke="#F0F0EB"/>
  <line x1="90" y1="185" x2="880" y2="185" stroke="#F0F0EB"/>
  <line x1="90" y1="240" x2="880" y2="240" stroke="#F0F0EB"/>

  <!-- y axis -->
  <text class="ax" x="80" y="79"  text-anchor="end">high</text>
  <text class="ax" x="80" y="244" text-anchor="end">low</text>
  <text class="axb" x="34" y="180" transform="rotate(-90 34 180)" text-anchor="middle">effective use</text>

  <!-- the dip region -->
  <rect x="270" y="60" width="380" height="230" fill="rgba(155,74,47,0.055)"/>
  <line x1="270" y1="60" x2="270" y2="290" stroke="rgba(155,74,47,.4)" stroke-dasharray="3 3"/>
  <line x1="650" y1="60" x2="650" y2="290" stroke="rgba(155,74,47,.4)" stroke-dasharray="3 3"/>

  <!-- curve: high, dip, recover -->
  <path d="M90 82
           C 150 84, 210 108, 270 158
           C 330 208, 400 232, 460 236
           C 520 232, 590 206, 650 160
           C 710 116, 800 92, 880 86"
        fill="none" stroke="#0A5C38" stroke-width="2.5" stroke-linecap="round"/>

  <!-- area under, faint -->
  <path d="M90 82
           C 150 84, 210 108, 270 158
           C 330 208, 400 232, 460 236
           C 520 232, 590 206, 650 160
           C 710 116, 800 92, 880 86
           L 880 290 L 90 290 Z"
        fill="rgba(10,92,56,0.05)"/>

  <!-- markers -->
  <circle cx="90"  cy="82"  r="5" fill="#0A5C38"/>
  <circle cx="460" cy="236" r="5" fill="#9B4A2F"/>
  <circle cx="880" cy="86"  r="5" fill="#0A5C38"/>

  <text class="annok" x="102" y="76">start of context</text>
  <text class="annok" x="874" y="76" text-anchor="end">end of context</text>
  <text class="ann"   x="460" y="262" text-anchor="middle">the same item, buried</text>

  <!-- x axis -->
  <text class="ax" x="90"  y="310">first</text>
  <text class="ax" x="460" y="310" text-anchor="middle">middle</text>
  <text class="ax" x="880" y="310" text-anchor="end">last</text>
  <text class="axb" x="485" y="332" text-anchor="middle">position of the item within the assembled context</text>

  <!-- footer mapping -->
  <line x1="30" y1="358" x2="890" y2="358" stroke="#E5E5E0"/>
  <text class="lede" x="30" y="380">Recommender systems named this <tspan font-weight="600">position bias</tspan> in the mid-2000s and correct for it with</text>
  <text class="lede" x="30" y="398">randomised exposure and propensity weighting. Agent context met it again as <tspan font-style="italic">lost in the middle</tspan>.</text>
</svg>
