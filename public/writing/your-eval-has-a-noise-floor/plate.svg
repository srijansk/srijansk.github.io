<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">Your Eval Has a Noise Floor</title>
  <!--
    PLATE GRAMMAR — see retrieval-is-not-delivery/plate.svg for the shared
    frame, strokes, dot radii and colours. g.ink is set by
    scripts/align-plates.py; do not hand-tune it.

    THIS PLATE: a field of movement that happens when nothing changes, and the
    single mark that rises clearly out of it. Everything inside the band is
    weather.
  -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <g class="ink" transform="translate(1,2)">
    <!-- the band: what an unchanged configuration already does -->
    <rect x="175" y="372" width="850" height="98" fill="rgba(155,74,47,0.09)"/>
    <line x1="175" y1="372" x2="1025" y2="372" stroke="#9B4A2F" stroke-width="3" stroke-dasharray="10 8" opacity=".75"/>

    <!-- noise -->
    <g stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" opacity=".32">
      <line x1="175" y1="470" x2="175" y2="420"/>
      <line x1="208" y1="470" x2="208" y2="411"/>
      <line x1="240" y1="470" x2="240" y2="384"/>
      <line x1="273" y1="470" x2="273" y2="419"/>
      <line x1="306" y1="470" x2="306" y2="415"/>
      <line x1="338" y1="470" x2="338" y2="409"/>
      <line x1="371" y1="470" x2="371" y2="440"/>
      <line x1="404" y1="470" x2="404" y2="415"/>
      <line x1="437" y1="470" x2="437" y2="406"/>
      <line x1="469" y1="470" x2="469" y2="394"/>
      <line x1="502" y1="470" x2="502" y2="447"/>
      <line x1="535" y1="470" x2="535" y2="431"/>
      <line x1="567" y1="470" x2="567" y2="447"/>
      <line x1="633" y1="470" x2="633" y2="392"/>
      <line x1="665" y1="470" x2="665" y2="401"/>
      <line x1="698" y1="470" x2="698" y2="451"/>
      <line x1="731" y1="470" x2="731" y2="379"/>
      <line x1="763" y1="470" x2="763" y2="381"/>
      <line x1="796" y1="470" x2="796" y2="404"/>
      <line x1="829" y1="470" x2="829" y2="407"/>
      <line x1="862" y1="470" x2="862" y2="442"/>
      <line x1="894" y1="470" x2="894" y2="453"/>
      <line x1="927" y1="470" x2="927" y2="414"/>
      <line x1="960" y1="470" x2="960" y2="449"/>
      <line x1="992" y1="470" x2="992" y2="440"/>
      <line x1="1025" y1="470" x2="1025" y2="436"/>
    </g>

    <!-- the result that clears the floor -->
    <line x1="600" y1="470" x2="600" y2="168" stroke="#0A5C38" stroke-width="13" stroke-linecap="round"/>
    <circle cx="600" cy="168" r="17" fill="#0A5C38"/>

    <!-- baseline -->
    <line x1="145" y1="470" x2="1055" y2="470" stroke="#1A1A1A" stroke-width="2" opacity=".55"/>
  </g>
</svg>
