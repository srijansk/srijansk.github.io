<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"
     aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">One compound rubric claim scored three ways</title>
  <desc id="desc">A single rubric claim is decomposed into four atomic assertions, and an artifact satisfies three of them. Scored whole, all-or-nothing, the claim earns zero. Credited by the fraction of assertions met, it earns seventy-five percent. Requiring every assertion, it earns zero again, from the same four verdicts. The same output produces a different headline number depending on the ruler.</desc>

  <style>
    .kicker { font-size: 11.75px; fill: #595959; letter-spacing: .11em; text-transform: uppercase; }
    .h      { font-size: 15.25px; fill: #1A1A1A; font-weight: 600; }
    .claim  { font-size: 14.1px; fill: #2F2F2F; }
    .atom   { font-size: 14.1px; fill: #2F2F2F; }
    .mark   { font-size: 14.1px; font-weight: 700; }
    .score  { font-size: 23.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .slabel { font-size: 12.9px; fill: #595959; }
    .note   { font-size: 12.9px; fill: #595959; }
  </style>

  <rect width="1000" height="440" fill="#FFFFFF"/>

  <g transform="translate(40,0)">
  <text class="kicker" x="30" y="26">One claim · four assertions · three rulers</text>

  <!-- the compound claim -->
  <rect x="30" y="42" width="860" height="52" rx="3" fill="#FAFAF7" stroke="#D8D8D2"/>
  <text class="h" x="46" y="64">Rubric claim</text>
  <text class="claim" x="158" y="64">“The nightly job excludes retried events before aggregating,</text>
  <text class="claim" x="158" y="82">and this behaviour changed in the second era of the pipeline.”</text>

  <!-- decomposition arrow -->
  <path d="M460 94 L460 116" stroke="#D8D8D2" stroke-width="1.25"/>
  <polygon points="460,122 455,114 465,114" fill="#D8D8D2"/>
  <text class="note" x="474" y="113">decompose</text>

  <!-- atomic assertions -->
  <g>
    <rect x="30" y="128" width="560" height="34" rx="2" fill="#FFFFFF" stroke="#E5E5E0"/>
    <circle cx="52" cy="145" r="8" fill="rgba(10,92,56,0.12)"/>
    <text class="mark" x="52" y="150" text-anchor="middle" fill="#0A5C38">✓</text>
    <text class="atom" x="74" y="150">a nightly job exists and aggregates this metric</text>

    <rect x="30" y="170" width="560" height="34" rx="2" fill="#FFFFFF" stroke="#E5E5E0"/>
    <circle cx="52" cy="187" r="8" fill="rgba(10,92,56,0.12)"/>
    <text class="mark" x="52" y="192" text-anchor="middle" fill="#0A5C38">✓</text>
    <text class="atom" x="74" y="192">retried events are excluded</text>

    <rect x="30" y="212" width="560" height="34" rx="2" fill="#FFFFFF" stroke="#E5E5E0"/>
    <circle cx="52" cy="229" r="8" fill="rgba(10,92,56,0.12)"/>
    <text class="mark" x="52" y="234" text-anchor="middle" fill="#0A5C38">✓</text>
    <text class="atom" x="74" y="234">the exclusion happens before aggregation, not after</text>

    <rect x="30" y="254" width="560" height="34" rx="2" fill="rgba(155,74,47,0.05)" stroke="rgba(155,74,47,0.3)"/>
    <circle cx="52" cy="271" r="8" fill="rgba(155,74,47,0.14)"/>
    <text class="mark" x="52" y="276" text-anchor="middle" fill="#9B4A2F">✕</text>
    <text class="atom" x="74" y="276" fill="#9B4A2F">the behaviour differs between the two pipeline eras</text>
  </g>

  <!-- scoring panels: three rulers over the same verdicts -->
  <rect x="620" y="128" width="270" height="49" rx="3" fill="rgba(155,74,47,0.05)" stroke="rgba(155,74,47,0.3)"/>
  <text class="slabel" x="636" y="146">Whole claim, all-or-nothing</text>
  <text class="score" x="636" y="170" fill="#9B4A2F">0%</text>
  <text class="note" x="690" y="170" fill="#9B4A2F">one verdict on the compound</text>

  <rect x="620" y="183" width="270" height="49" rx="3" fill="rgba(10,92,56,0.06)" stroke="rgba(10,92,56,0.35)"/>
  <text class="slabel" x="636" y="201">Fraction of assertions met</text>
  <text class="score" x="636" y="225" fill="#0A5C38">75%</text>
  <text class="note" x="700" y="225" fill="#0A5C38">3 of 4 assertions</text>

  <rect x="620" y="238" width="270" height="49" rx="3" fill="#FAFAF7" stroke="#D8D8D2"/>
  <text class="slabel" x="636" y="256">All assertions required</text>
  <text class="score" x="636" y="280" fill="#1A1A1A">0%</text>
  <text class="note" x="690" y="280">same verdicts, stricter rule</text>

  <!-- footer -->
  <line x1="30" y1="322" x2="890" y2="322" stroke="#E5E5E0"/>
  <text class="note" x="30" y="346">Same artifact. Same evidence. Three headline numbers, because the ruler changed, not the work.</text>
  <text class="note" x="30" y="368">Decomposition changes what a verdict means: each assertion asks one question instead of several.</text>
  <text class="note" x="30" y="386">The aggregation rule decides which way the number moves.</text>

  <rect x="30" y="400" width="860" height="26" rx="2" fill="#FAFAF7"/>
  <text class="note" x="44" y="418" fill="#2F2F2F">Rule: a score is comparable only to another score computed under the same claim-set version. Ship the changelog.</text>
  </g>
</svg>
