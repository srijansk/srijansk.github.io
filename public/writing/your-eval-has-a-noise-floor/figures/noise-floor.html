<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Is your result outside the noise?</title>
<link rel="stylesheet" href="../../_figure.css" />
<style>
  .toggle { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; flex-wrap: wrap; }
  .toggle-label { font-size: 11px; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--hairline-strong); border-radius: 3px; overflow: hidden; }
  .seg button { padding: 6px 14px; font-size: 12px; color: var(--muted); background: var(--bg); font-variant-numeric: tabular-nums; transition: background 120ms, color 120ms; }
  .seg button + button { border-left: 1px solid var(--hairline-strong); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; font-weight: 600; }

  .scale { position: relative; height: 76px; margin: 14px 0 0; }

  .band {
    position: absolute;
    top: 0;
    height: 56px;
    border-radius: 2px;
  }
  .band-noise { left: 0; background: rgba(194,65,12,0.13); transition: width 160ms ease-out; }
  .band-clear { background: rgba(36,67,214,0.07); }

  .band-edge {
    position: absolute;
    top: 0;
    height: 56px;
    border-left: 1px dashed rgba(194,65,12,.6);
    transition: left 160ms ease-out;
  }

  .marker {
    position: absolute;
    top: -10px;
    height: 76px;
    border-left: 2px solid var(--text);
    transition: left 90ms linear;
  }
  .marker::after {
    content: '';
    position: absolute;
    left: -5px; top: -1px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 8px solid var(--text);
  }

  .axis {
    position: absolute;
    top: 56px; left: 0; right: 0;
    border-top: 1px solid var(--hairline-strong);
  }
  .tick {
    position: absolute;
    top: 58px;
    font-size: 10px;
    color: var(--muted);
    transform: translateX(-50%);
    font-variant-numeric: tabular-nums;
  }

  .band-label { font-size: 11px; color: var(--warn); margin: 4px 0 0; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .controls label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  input[type=range] { flex: 1; min-width: 0; accent-color: #2443D6; }

  .readout {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 96px;
    text-align: right;
  }
  .readout small { font-size: 11px; font-weight: 400; color: var(--muted); display: block; }

  .verdict {
    margin-top: 16px;
    border-top: 1px solid var(--hairline-strong);
    padding-top: 12px;
    min-height: 62px;
  }
  .verdict-h {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .verdict-b { font-size: 12px; color: var(--soft); margin: 0; }
  .bad  .verdict-h { color: var(--warn); }
  .good .verdict-h { color: var(--accent); }

  @media (max-width: 480px) {
    .controls { flex-wrap: wrap; gap: 8px 12px; }
    .controls label { width: 100%; }
    .readout { min-width: 0; text-align: left; font-size: 20px; }
  }
</style>
</head>
<body>

<p class="fig-kicker">An observed difference, against what moves on its own</p>

<div class="toggle">
  <span class="toggle-label" id="nLabel">Runs per configuration</span>
  <div class="seg" role="group" aria-labelledby="nLabel">
    <button data-n="1" aria-pressed="true">1</button>
    <button data-n="3" aria-pressed="false">3</button>
    <button data-n="10" aria-pressed="false">10</button>
  </div>
</div>

<div class="scale" id="scale">
  <div class="band band-clear" style="left:0; right:0"></div>
  <div class="band band-noise" id="band"></div>
  <div class="band-edge" id="edge"></div>
  <div class="axis"></div>
  <div class="marker" id="marker"></div>
</div>
<p class="band-label" id="bandLabel"></p>

<div class="controls">
  <label for="delta">Observed difference between two configurations</label>
  <input type="range" id="delta" min="0" max="20" step="1" value="5"
         aria-describedby="verdictText" />
  <span class="readout">+<span id="val">5</span> / 60<small id="pts">+8.3 points</small></span>
</div>

<div class="verdict" id="verdict">
  <p class="verdict-h" id="verdictH"></p>
  <p class="verdict-b" id="verdictText"></p>
</div>

<p class="fig-hint">Band half-width: 1.96 &times; 6.4 &times; &radic;(2/n) claims, taking &sigma; = 6.4 as known. Judging noise sits inside it and is the smaller part; the rest is generation.</p>

<script>
  var MAX = 20, SD = 6.4, n = 1;
  var scale = document.getElementById('scale');
  var range = document.getElementById('delta');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.seg button'));

  function half(runs) { return 1.96 * SD * Math.sqrt(2 / runs); }
  function pctOf(v) { return (Math.min(v, MAX) / MAX) * 100; }

  // Axis ticks every 4 claims.
  for (var t = 0; t <= MAX; t += 4) {
    var el = document.createElement('span');
    el.className = 'tick';
    el.style.left = pctOf(t) + '%';
    el.textContent = t;
    scale.appendChild(el);
  }

  function update() {
    var v = Number(range.value), h = half(n);
    document.getElementById('val').textContent = v;
    document.getElementById('pts').textContent = '+' + (v / 60 * 100).toFixed(1) + ' points';
    document.getElementById('marker').style.left = pctOf(v) + '%';
    document.getElementById('band').style.width = pctOf(h) + '%';
    document.getElementById('edge').style.left = pctOf(h) + '%';
    document.getElementById('bandLabel').textContent =
      'Noise band at ' + n + (n === 1 ? ' run' : ' runs') + ' each: ±' + h.toFixed(1) + ' claims';

    var box = document.getElementById('verdict');
    var H = document.getElementById('verdictH'), T = document.getElementById('verdictText');
    if (v <= h) {
      box.className = 'verdict bad';
      H.textContent = 'Inside the noise at ' + n + (n === 1 ? ' run' : ' runs') + ' each';
      T.textContent = 'Identical configurations, run this many times each, differ by at least this much more than one time in twenty. More judge passes will not fix it; most of the movement here is generation. Run both configurations again.';
    } else {
      box.className = 'verdict good';
      H.textContent = 'Distinguishable at ' + n + (n === 1 ? ' run' : ' runs') + ' each (95%)';
      T.textContent = 'Fewer than one comparison in twenty between identical configurations differs this much. That is evidence, not proof: publish the spread with the mean, and check that the effect survives a fresh set of runs.';
    }
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      n = Number(b.dataset.n);
      buttons.forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      update();
    });
  });
  range.addEventListener('input', update);
  update();
</script>
<script src="../../_figure.js"></script>
</body>
</html>
